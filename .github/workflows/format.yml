name: format

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  format:
    name: dotnet format (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: ga

      - name: Verify formatting
        run: dotnet format weather.slnx --verify-no-changes --severity warn
